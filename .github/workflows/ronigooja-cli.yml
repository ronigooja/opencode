name: ronigooja-cli

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          sparse-checkout: packages/cli/package.json
          sparse-checkout-cone-mode: false

      - name: Version
        id: version
        run: echo "value=$(jq -r .version packages/cli/package.json)-ronigooja.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.4

      - name: Fetch models catalog
        run: bun packages/core/script/update-models-snapshot.ts .cache/models-catalog/api.json

      - name: Build
        working-directory: packages/cli
        run: bun run build && rm -rf dist/.bun
        env:
          OPENCODE_TARGET: ${{ matrix.target }}
          OPENCODE_VERSION: ${{ needs.version.outputs.value }}
          OPENCODE_CHANNEL: latest
          BUN_COMPILE_RELEASE: bun-v1.4.4
          OPENCODE_MODELS_SNAPSHOT: ${{ github.workspace }}/.cache/models-catalog/api.json
          GH_TOKEN: ${{ github.token }}

      - name: Sign
        if: startsWith(matrix.target, 'darwin-')
        run: codesign --force --options runtime --entitlements .github/release/entitlements/cli.plist --sign - packages/cli/dist/cli-${{ matrix.target }}/bin/opencode

      - name: Verify bundled models catalog
        run: bun packages/cli/script/catalog-smoke.ts packages/cli/dist/cli-${{ matrix.target }}/bin/opencode
        env:
          OPENCODE_MODELS_SNAPSHOT: ${{ github.workspace }}/.cache/models-catalog/api.json

      - name: Package
        run: COPYFILE_DISABLE=1 tar -czf opencode-${{ matrix.target }}.tar.gz -C packages/cli/dist/cli-${{ matrix.target }}/bin opencode

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-${{ matrix.target }}
          path: opencode-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: opencode-*
          merge-multiple: true

      - name: Checksums
        run: sha256sum opencode-*.tar.gz > SHA256SUMS

      - name: Publish
        run: |
          gh release create "v${VERSION}" opencode-*.tar.gz SHA256SUMS \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v${VERSION}" \
            --notes "Linux x64, Linux arm64 and macOS arm64 CLI built from ${{ github.sha }}."
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.value }}
